name: CI

# 目的：把「提交前必须过」的检查固化成流水线，避免再出现
# 「本地能跑、合进去才炸」以及测试长期没人跑的情况。
on:
  push:
    branches: [main, master]
  pull_request:

# 同一分支连续推送时，取消上一次未跑完的构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 测试环境变量：刻意不依赖任何外部服务（Redis/Neo4j 缺失时由代码自动降级）
      # SECRET_KEY 用强随机值而非 "test-secret"：启动校验现在与 DEBUG 解耦，
      # 弱密钥会直接拒绝启动，CI 正好顺带验证「生产不会带着占位密钥跑起来」。
      SECRET_KEY: 9f3a1c7e5b2d4a608c1f7e3b9d2a5c4e8f1b6d3a7c0e9f2b5d8a1c4e7f0b3d6a
      DEBUG: "true"
      ALLOW_DEV_LOGIN: "true"
      SMS_DEV_MASTER_CODE: "123456"
      DEV_LOGIN_PHONE_ALLOWLIST: "13900000001,13800138004,13612345678"
      SCHEDULER_ENABLED: "false"
      DEMO_BOOTSTRAP: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 静态检查（ruff）
        run: ruff check app tests

      - name: 单元/接口测试（pytest）
        run: pytest -q

  frontend:
    name: 前端 · eslint + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 代码规范（eslint）
        run: npm run lint

      - name: 生产构建（vite）
        run: npm run build

# 生产部署编排（自建服务器 / 香港 VPS 等）
#
# 用途：一台 2C2G 的 Linux 服务器上跑完整栈 —— 应用 + Neo4j（可写图谱，支持上传抽取）。
#
# 使用：
#   1) 复制 .env.production.example 为 .env.production 并填写（尤其是 SECRET_KEY 与 Neo4j 密码）
#   2) docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   3) 首次启动会自动灌入演示数据（可 DEMO_BOOTSTRAP=false 关闭）
#
# 与 docker-compose.yml 的区别：那份是「本地开发基础设施」（Postgres+Redis+Neo4j），
# 这份是「单机生产部署」（本应用容器 + Neo4j + Redis，关系库用 SQLite）。
# 为什么要带 Redis：短信验证码、登录失败计数、接口限流都存在 Redis 里；
# 没有 Redis 时 /auth/send-code 只能直接 503，非演示账号无法登录。

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # 演示态构建参数：把演示账号注入前端产物，登录框会显示可一键登录的提示条。
      # 这是「演示期的显式选择」，不是源码默认值。切正式环境时删掉整个 args 段即可，
      # 源码里不再有写死的手机号/验证码兜底。
      args:
        VITE_DEMO_MODE: "true"
        VITE_DEMO_PHONE: "13900000001"
        VITE_DEMO_CODE: "123456"
    image: krp-app:latest
    container_name: krp-app
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      # 演示态：短信服务尚未接通，用万能验证码让演示账号可登录。
      # 安全边界：万能码**只对下面白名单里的手机号生效**（见 app/api/v1/endpoints/auth.py），
      # 其他手机号即使知道 123456 也无法登录，避免「任意手机号 = 任意账号」被接管。
      # 正式对外前应整体改为 DEBUG=false / ALLOW_DEV_LOGIN=false / SMS_DEV_MASTER_CODE=""。
      DEBUG: "true"
      ALLOW_DEV_LOGIN: "true"
      # 接口文档保持关闭：调试态下 /docs 会把完整接口面公开到公网，演示也不需要它
      ENABLE_API_DOCS: "false"
      # 万能够码必须显式配置才生效（代码里已无默认值），此处显式给出以维持演示行为
      SMS_DEV_MASTER_CODE: "123456"
      # 白名单外的手机号一律无法用万能码登录；新增演示号请在此追加（英文逗号分隔）
      DEV_LOGIN_PHONE_ALLOWLIST: "13900000001"
      DEMO_BOOTSTRAP: "true"
      POSTGRES_URL: "sqlite+aiosqlite:////data/krp.db"
      GRAPH_BACKEND: "auto"
      FRONTEND_DIST: "/app/frontend_dist"
      UPLOAD_DIR: "/data/uploads"
      # 访问令牌有效期：演示环境不需要「一次登录管一周」，缩短到 1 天使被截获的 token 尽快失效。
      # 配合下方 Nginx/Caddy 终止 TLS，避免 token 明文过网。
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      NEO4J_URI: "bolt://neo4j:7687"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      SCHEDULER_ENABLED: "true"
    # 最小权限：以镜像内的非 root 用户运行，丢弃全部 Linux capabilities，
    # 并禁止 setuid 提权。首次切换需要先把 /data 卷的所有者改为该 UID（见 README 预检命令）。
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - krp-data:/data # SQLite 与上传文件持久化
    ports:
      # 只绑定本机，由宿主机 Nginx/Caddy 反代并终止 TLS（不直接暴露 8000）
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  neo4j:
    image: neo4j:5.26-community
    container_name: krp-neo4j
    restart: unless-stopped
    environment:
      # 密码由 .env.production 提供；用户名固定 neo4j
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?请在 .env.production 设置 NEO4J_PASSWORD}"
      # 2C2G 机器的内存调优（Neo4j 是 Java 应用，必须限制，否则会 OOM）
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "512m"
      NEO4J_server_memory_pagecache_size: "256m"
      # 允许应用的 Cypher 查询（默认即可，这里显式声明便于排查）
      NEO4J_dbms_security_auth__minimum__password__length: "8"
    volumes:
      - krp-neo4j:/data
      - krp-neo4j-logs:/logs
    ports:
      # 只绑本机：需要从外部看图谱时用 SSH 隧道，不直接暴露 7474/7687
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: krp-redis
    restart: unless-stopped
    # 只在内网供 app 使用，不映射端口；appendonly 保证重启后验证码/计数不丢太多
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - krp-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  krp-data:
  krp-neo4j:
  krp-neo4j-logs:
  krp-redis:
